name: forecast-runner
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet lightgbm scikit-learn numpy
      - name: Fetch models
        run: |
          git fetch origin main
          git checkout origin/main -- models scripts data/feat_meta.json
      - name: Run forecast
        run: |
          python3 scripts/predict.py > live.json
          cat live.json
      - name: Commit
        run: |
          git config user.name "forecast-bot"
          git config user.email "noreply@github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "forecast $(date -u +%FT%TZ)"
          git push origin data
