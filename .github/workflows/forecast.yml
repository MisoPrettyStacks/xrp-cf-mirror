name: forecast-runner
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  forecast:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet lightgbm scikit-learn numpy
      - name: Fetch models
        run: |
          git fetch origin main
          git checkout origin/main -- models scripts data/feat_meta.json
      - name: Run forecast
        run: |
          python3 scripts/predict.py > live_new.json
          cat live_new.json
          python3 -c "
          import json, shutil, sys
          d = json.load(open('live_new.json'))
          if 'error' in d:
              print('forecast failed, keeping previous live.json', file=sys.stderr)
              sys.exit(0)
          shutil.move('live_new.json', 'live.json')
          rec = {'asof': d['asof'], 'window_open': d['window_open'],
                 'window_close': d['window_close'], 'p_up': d['p_up'],
                 'components': d.get('components', {})}
          open('ledger.jsonl', 'a').write(json.dumps(rec) + chr(10))
          "
      - name: Commit
        run: |
          git config user.name "forecast-bot"
          git config user.email "noreply@github.com"
          git add live.json ledger.jsonl
          git diff --cached --quiet || git commit -m "forecast $(date -u +%FT%TZ)"
          # Discard any stray working-tree modifications (e.g. regenerated
          # bytecode) so pull --rebase never refuses to run.
          git checkout -- . || true
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin data && git push origin data; then
              pushed=true
              break
            fi
            echo "push rejected (concurrent update), retrying ($i/5)"
            sleep 5
          done
          if [ "$pushed" = false ]; then
            echo "ERROR: failed to push to data branch after 5 retries"
            exit 1
          fi
