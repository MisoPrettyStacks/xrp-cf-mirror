name: weekly-retrain
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet lightgbm scikit-learn numpy
      - name: Retrain (champion vs challenger)
        run: python3 scripts/retrain.py
      - name: Commit
        run: |
          git config user.name "retrain-bot"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly retrain $(date -u +%F)"
          git push origin main
