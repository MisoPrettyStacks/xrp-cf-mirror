name: score-ledger
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet scikit-learn numpy
      - name: Fetch scripts
        run: git fetch origin main && git checkout origin/main -- scripts
      - name: Score
        run: python3 scripts/score.py
      - name: Commit
        run: |
          git config user.name "score-bot"
          git config user.email "noreply@github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "stats $(date -u +%FT%TZ)"
          # Discard any stray working-tree modifications (e.g. regenerated
          # bytecode) so pull --rebase never refuses to run.
          git checkout -- . || true
          pushed=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin data && git push origin data; then
              pushed=true
              break
            fi
            echo "push rejected (concurrent update), retrying ($i/5)"
            sleep 5
          done
          if [ "$pushed" = false ]; then
            echo "ERROR: failed to push to data branch after 5 retries"
            exit 1
          fi
